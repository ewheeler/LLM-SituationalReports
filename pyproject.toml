[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitrep"
version = "0.1.0"
description = "Scaffold for a humanitarian situation report generator"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "python-dotenv>=1.0",
  "PyYAML>=6",
  "sf-hamilton>=1",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
advanced-clustering = [
  "hdbscan>=0.8.40",
  "sentence-transformers>=3.0",
  "umap-learn>=0.5.7",
]
semantic-dedupe = [
  "sentence-transformers>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
